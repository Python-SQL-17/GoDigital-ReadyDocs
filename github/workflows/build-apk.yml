name: Build GoDigital Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'GoDigital_GitHubActions_Build.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verify project ZIP
        run: |
          test -f GoDigital_GitHubActions_Build.zip || {
            echo "Missing GoDigital_GitHubActions_Build.zip at repository root."
            exit 1
          }

      - name: Extract source
        run: |
          rm -rf source
          mkdir source
          unzip -q GoDigital_GitHubActions_Build.zip -d source
          test -f source/go_digital_readydocs_android/pubspec.yaml

      - name: Generate Android project files
        working-directory: source/go_digital_readydocs_android
        run: |
          mkdir -p /tmp/godigital
          if [ -f android/app/src/main/AndroidManifest.xml ]; then
            cp android/app/src/main/AndroidManifest.xml /tmp/godigital/AndroidManifest.xml
          fi
          flutter create . \
            --platforms=android \
            --org com.godigitalservices \
            --project-name go_digital_readydocs
          if [ -f /tmp/godigital/AndroidManifest.xml ]; then
            cp /tmp/godigital/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          fi

      - name: Get packages
        working-directory: source/go_digital_readydocs_android
        run: flutter pub get

      - name: Build release APK
        working-directory: source/go_digital_readydocs_android
        run: flutter build apk --release

      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp source/go_digital_readydocs_android/build/app/outputs/flutter-apk/app-release.apk dist/GoDigital-ReadyDocs-v0.1.apk
          sha256sum dist/GoDigital-ReadyDocs-v0.1.apk > dist/GoDigital-ReadyDocs-v0.1.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GoDigital-ReadyDocs-APK
          path: dist/*
          if-no-files-found: error
          retention-days: 14
